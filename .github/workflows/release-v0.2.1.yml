name: Publish v0.2.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.2.1.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-show-status-v0.2.1
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'ReallocAll/endstone-show-status' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare versioned candidate without changing main
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git ls-remote origin refs/tags/v0.2.1)"
          if gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.2.1 already exists; refusing to overwrite it' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import tomllib
          project_path = Path('pyproject.toml')
          text = project_path.read_text(encoding='utf-8')
          project = tomllib.loads(text)['project']
          assert project['version'] == '0.2.0', project['version']
          assert 'endstone==0.11.11' in project['dependencies']
          assert text.count('version = "0.2.0"') == 1
          project_path.write_text(text.replace('version = "0.2.0"', 'version = "0.2.1"'), encoding='utf-8')
          for filename in ('README.md', 'README_ZH.md'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              old = 'endstone_show_status-0.2.0-py3-none-any.whl'
              assert text.count(old) == 1, filename
              path.write_text(text.replace(old, 'endstone_show_status-0.2.1-py3-none-any.whl'), encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          assert text.count('## [Unreleased]') == 1
          assert '## [0.2.1]' not in text
          text = text.replace('## [Unreleased]', '## [Unreleased]\n\n## [0.2.1] - 2026-09-17', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml CHANGELOG.md README.md README_ZH.md
          git commit -m 'chore: release show-status v0.2.1'
          candidate=$(git rev-parse HEAD)
          ref="refs/heads/release-candidates/show-status-v0.2.1-$GITHUB_RUN_ID"
          git push origin "$candidate:$ref"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "base=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and build frontend
        run: |
          python -m pip install --upgrade pip build psutil
          python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build release wheel
        run: python -m build --wheel
      - name: Verify release metadata and bundled web assets
        shell: python
        run: |
          from email.parser import BytesParser
          from pathlib import Path
          import zipfile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          assert wheels[0].name == 'endstone_show_status-0.2.1-py3-none-any.whl'
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_names = [name for name in names if name.endswith('.dist-info/METADATA')]
              assert len(metadata_names) == 1
              metadata = BytesParser().parsebytes(archive.read(metadata_names[0]))
              assert metadata['Version'] == '0.2.1'
              assert metadata['Requires-Python'] == '>=3.10'
              assert 'endstone==0.11.11' in metadata.get_all('Requires-Dist', [])
              for suffix in ('.html', '.css', '.js', '.svg'):
                  assert any('/webui/' in name and name.endswith(suffix) for name in names), suffix
          print('Verified v0.2.1 wheel, exact Endstone dependency, Python baseline, and web assets')
      - uses: actions/upload-artifact@v7
        with:
          name: show-status-v0.2.1-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  finalize:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Atomically publish the validated main and tag
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/tags/v0.2.1)"
          git push --atomic origin "$CANDIDATE_SHA:refs/heads/main" "$CANDIDATE_SHA:refs/tags/v0.2.1"
      - name: Run the existing CI and official Release workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v0.2.1 -f prerelease=false -f dry_run=false
          echo 'Dispatched CI and the existing Release workflow for validated v0.2.1' >> "$GITHUB_STEP_SUMMARY"
