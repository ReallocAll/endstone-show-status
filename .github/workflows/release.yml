name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build and upload a validation wheel without creating a release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dry-run candidate
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Check out release ref
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          expected = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          actual = tag.removeprefix("v")
          if not tag.startswith("v") or actual != expected:
              raise SystemExit(
                  f"Release tag {tag!r} does not match pyproject version {expected!r}"
              )
          print(f"Verified release tag {tag} for version {expected}")
          PY

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload dry-run wheel
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/upload-artifact@v7
        with:
          name: endstone-show-status-dry-run-${{ github.run_id }}
          path: dist/*.whl

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: dist/*.whl
