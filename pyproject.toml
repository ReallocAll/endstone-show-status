[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-show-status"
version = "0.3.0"
description = "Configurable in-game TPS/MSPT/PING HUD for Endstone"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ReallocAll/endstone-show-status"
Repository = "https://github.com/ReallocAll/endstone-show-status"
Issues = "https://github.com/ReallocAll/endstone-show-status/issues"

[project.entry-points."endstone"]
show_status = "endstone_show_status:ShowStatus"

[tool.setuptools]
packages = ["endstone_show_status"]
package-dir = {endstone_show_status = "."}
