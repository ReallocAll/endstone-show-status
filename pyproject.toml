[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-show-status"
version = "0.2.0"
description = "Public Endstone server status page"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "endstone>=0.12,<0.13",
    "psutil>=5",
]

[project.urls]
Homepage = "https://github.com/ReallocAll/endstone-show-status"
Repository = "https://github.com/ReallocAll/endstone-show-status"
Issues = "https://github.com/ReallocAll/endstone-show-status/issues"

[project.entry-points."endstone"]
show_status = "endstone_show_status:ShowStatus"

[tool.setuptools]
packages = ["endstone_show_status", "endstone_show_status.webui"]
package-dir = {endstone_show_status = ".", "endstone_show_status.webui" = "webui"}

[tool.setuptools.package-data]
"endstone_show_status.webui" = ["*.html", "*.css", "*.js", "*.svg"]
